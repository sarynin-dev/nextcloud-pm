# Обратный прокси Nginx: перенаправление HTTP -> HTTPS и проксирование в Nextcloud

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/nextcloud.crt;
    ssl_certificate_key /etc/nginx/certs/nextcloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Максимальный размер загружаемого файла
    client_max_body_size 1G;

    # Заголовки безопасности
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Служебные адреса для CalDAV/CardDAV (календари и задачи)
    location = /.well-known/carddav { return 301 https://$host/remote.php/dav/; }
    location = /.well-known/caldav  { return 301 https://$host/remote.php/dav/; }

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
