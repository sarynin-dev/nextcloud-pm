name: Nextcloud PM CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: 1. Валидация и проверка синтаксиса
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Проверка синтаксиса Docker Compose
        run: |
          cp .env.example .env
          docker compose config

      - name: Проверка конфигурации Nginx
        run: |
          sh scripts/gen-cert.sh
          docker run --rm --add-host app:127.0.0.1 \
                          -v $(pwd)/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
                          -v $(pwd)/nginx/certs:/etc/nginx/certs:ro \
                          nginx:1.27-alpine nginx -t

      - name: Проверка shell-сценариев (ShellCheck)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S error scripts/*.sh

  test-deploy:
    name: 2. Тестовое развёртывание и интеграционные тесты
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Подготовка окружения
        run: |
          cp .env.example .env
          sh scripts/gen-cert.sh

      - name: Запуск контейнерного стека
        run: |
          docker compose up -d

      - name: Проверка доступности Nextcloud через Reverse Proxy
        run: |
          echo "Ожидание запуска Nextcloud..."
          for i in $(seq 1 15); do
            if curl -k -I https://localhost 2>/dev/null | grep -E "HTTP/(1.1|2) (200|302)"; then
              echo "Nextcloud успешно отвечает по HTTPS!"
              exit 0
            fi
            echo "Попытка $i: сервис поднимается, ждём 4 секунды..."
            sleep 4
          done
          echo "Сервер не успел ответить"
          exit 1

      - name: Остановка тестового стенда
        if: always()
        run: docker compose down -v

  deploy-prod:
    name: 3. Автоматический деплой в кластер (CD)
    needs: test-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на целевой сервер
        run: |
          echo "Имитация развёртывания в Docker Swarm кластер:"
          echo "docker stack deploy -c docker-stack.yml nextcloud-cluster"
          echo "Деплой успешно завершён!"